task: local_medqa
dataset_path: parquet
dataset_kwargs:
  data_files:
    train: DATA_DIR/train/medqa/train.parquet
    test: DATA_DIR/eval/medqa/test.parquet
output_type: generate_until
training_split: train
test_split: test
doc_to_text: !function local_medqa_utils.doc_to_text
doc_to_target: !function local_medqa_utils.doc_to_target
process_results: !function local_medqa_utils.process_results
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: extracted
    aggregation: mean
    higher_is_better: true
generation_kwargs:
  until:
    - "Question:"
    - "</s>"
    - "<|im_end|>"
  max_gen_toks: 256
  do_sample: false
  temperature: 0.0
repeats: 1
num_fewshot: 0
metadata:
  version: 1.0
